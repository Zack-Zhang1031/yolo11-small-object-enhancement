name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m mypy
      - run: python -m compileall src scripts tests -q
      - run: python -m pytest -q
      - run: python scripts/build_all.py
      - run: python scripts/smoke_test.py
      - run: python -m build --wheel
      - shell: python
        run: |
          import glob
          import subprocess
          import sys
          wheel = glob.glob("dist/*.whl")[0]
          subprocess.run([sys.executable, "scripts/verify_wheel.py", wheel], check=True)
      - run: python scripts/train.py --model mobilevit-msca-p2 --data configs/visdrone.yaml --dry-run
